<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Đăng nhập · ATMO Costing</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="auth-page">
  <main class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark">AT</div>
      <h1>ATMO Costing</h1>
      <p class="muted">Đăng nhập để đồng bộ dữ liệu giá in 3D trên mọi thiết bị.</p>

      <div class="auth-tabs">
        <button id="authLoginTab" class="auth-tab active" type="button">Đăng nhập</button>
        <button id="authSignupTab" class="auth-tab" type="button">Tạo tài khoản</button>
      </div>

      <form id="authForm">
        <label>Email
          <input id="authEmail" type="email" autocomplete="email" required>
        </label>
        <label>Mật khẩu
          <input id="authPassword" type="password" minlength="6" autocomplete="current-password" required>
        </label>
        <button id="authSubmit" class="btn primary full" type="submit">Đăng nhập</button>
      </form>

      <p id="authMessage" class="auth-message"></p>
      <p class="hint">Dữ liệu được bảo vệ bằng Row Level Security của Supabase.</p>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
